# Render blueprint for Clio.
#
# Single web service: the Node/Express backend serves both the API (under /api)
# and the built static frontend, so everything is one origin — session cookies
# stay same-origin (sameSite=lax) and no CORS/proxy is involved.
#
# The Postgres database lives on Neon (not Render). Before the first deploy,
# create the Neon project and load the schema:
#   psql "$NEON_DATABASE_URL" -f database/db_migrations.sql
#   psql "$NEON_DATABASE_URL" -f database/db_seeding.sql
#
# After the first deploy, set DATABASE_URL to the Neon connection string
# (and GEMINI_API_KEY if you want the "Ask Clio" chat).

services:
  - type: web
    name: clio-ai
    runtime: node
    plan: free
    # Build the frontend, then the backend. --include=dev on both: NODE_ENV=production
    # makes npm skip devDependencies, but the build tools (vite, tsc, @types/*) live there.
    buildCommand: >-
      cd frontend && npm install --include=dev && npm run build &&
      cd ../backend && npm install --include=dev && npm run build
    # Run the backend from its own directory; it serves ../frontend/dist statically.
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # set to the Neon connection string
      - key: PG_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: SEED_SQL_PATH
        value: ../database/db_seeding.sql
      - key: GEMINI_API_KEY
        sync: false   # optional — only needed for the "Ask Clio" chat
